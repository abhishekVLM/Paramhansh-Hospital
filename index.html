    }</script><script defer="defer" src="/static/js/main.18e423c6.js"></script><link href="/static/css/main.e6c13ad2.css" rel="stylesheet"></head><body><noscript><h1>Paramhans Institute of Neurology - Best Neurology Hospital in Patna, Bihar</h1><p>Expert care in neurology, trauma and joint replacement by Dr. Sanjay Kumar (FRCP London, DM Neurology). 62+ centrally air-conditioned beds, 24/7 emergency services, over 1 Lakh patients treated worldwide. Located at B 18, Besides SBI, Near Kendriya Vidyalaya, Kankarbagh, Patna 800020.</p><p>Call: +91 9304508599 | 0612-2666667 | Email: info@pinpat.in</p><h2>Our Specialist Doctors</h2><p>Dr. Sanjay Kumar - Founder and Director, Head of Department of Neurology PMCH - MD (Medicine), DM (Neurology), MRCP (UK), FRCP (London). One of the best neurologists in Patna and Bihar.</p><p>Dr. Ajay Kumar - MBBS, MD (Microbiology)</p><p>Dr. Anshuman Kumar - Director and Chief Cancer Surgeon - MBBS (Hons.) Gold Medalist PMCH Patna, MS (Surgery) AMU Aligarh, MRCS (Edinburgh) UK, M.Ch (Oncosurgery) Gold Medalist GCRI Ahmedabad</p><p>Dr. Deepak Kr. Mishra - Visiting Orthopaedic Surgeon - MBBS (JIPMER), MS Ortho (JIPMER), MRCSEd (UK), M.Ch Ortho (UK), FICS Ortho (USA), Hip and Knee Replacement Surgeon</p><p>Dr. Manish Kumar Dhiraj - Neurosurgeon - MBBS (Gold Medallist), MS (Surgery), M.Ch Neurosurgery (IPGMER Kolkata), NSSA Fellowship in Endoscopic Spinal Surgery</p><p>Dr. Monika Jha - Chief of Emergency Medicine - Faculty of Emergency Medicine PMCH, MBBS, MD (Medicine)</p><p>Dr. Rashmi Soni - Associate Professor PMCH Patna, MD (Microbiology)</p><p>Dr. Setubandhu Tiwary - Head of Trauma Surgery - MS General Surgery, M.Ch Plastic Surgery PMCH Patna, Ex Senior Resident AIIMS New Delhi</p><h2>Diagnostic Tests Available at Paramhans Institute Patna</h2><h3>Polysomnography (Sleep Study) in Patna</h3><p>A special overnight test where we monitor your body while you sleep. It helps detect sleep problems like loud snoring, breathing stops during sleep (sleep apnea), restless or poor sleep, and daytime tiredness. We use sensors to record brain waves, breathing, heart rate, and body movement. Painless and done in a quiet, comfortable room.</p><h3>Urodynamics Test in Patna</h3><p>This test checks how well your bladder and urinary system are working. Useful if you have trouble passing urine, urinate too often or too little, leak urine (incontinence), or have nerve-related bladder issues. We use small tubes and machines to measure how your bladder fills and empties.</p><h3>Musculoskeletal Ultrasound (MSK USG) in Patna</h3><p>A safe and painless scan that uses sound waves to see muscles, joints, ligaments, and nerves. Used for muscle pain or swelling, sports injuries, joint problems like arthritis, and nerve entrapment such as carpal tunnel.</p><h3>Echocardiography (Echo) Test in Patna</h3><p>An ultrasound of your heart that shows how well your heart is pumping blood and how your valves are working. Useful for chest pain, high blood pressure, heart murmurs, and shortness of breath. Completely safe, painless, and takes about 20-30 minutes.</p><h3>Ultrasonography (USG) in Patna</h3><p>A general ultrasound test for viewing internal organs like liver, kidney, gallbladder, abdomen, uterus or prostate. It helps find stones, tumours, infections, or other internal problems. No radiation is used, so it is very safe.</p><h3>CT Scan (Brain and Body) in Patna</h3><p>A fast, advanced scan that gives detailed pictures of your brain or other body parts. Used for stroke or head injury, tumors, brain swelling or bleeding, and abdominal pain or trauma. Provides quicker results than many other imaging tests.</p><h3>Nerve Conduction Study (NCS) in Patna</h3><p>This test checks how fast and how strong signals are traveling in your nerves. Helpful for numbness or tingling, nerve pain, muscle weakness, and diabetic neuropathy. Small electrodes are placed on your skin, and a mild electrical signal is passed through your nerves. Safe and tolerable.</p><h3>EEG and Video EEG Test in Patna</h3><p>EEG (electroencephalogram) records brain activity through small wires placed on your scalp. Video EEG includes a camera to record your movements during the test. Used to detect seizures or epilepsy, unexplained blackouts or fainting, and brain infections or tumors. Non-invasive and pain-free.</p><h3>Holter Monitoring in Patna</h3><p>A small device like a portable ECG attached to your chest and worn for 24 to 48 hours. It records your heart activity while you go about your daily routine. Used for irregular heartbeat, palpitations, fainting spells, and monitoring pacemaker function.</p><h3>Vertigo and Balance Testing Panel in Patna</h3><p>A group of tests that help find the cause of dizziness, vertigo (feeling like the room is spinning), and balance problems or frequent falls. Includes VNG, Audiometry, BERA, Tilt Table Test, and vHIT.</p><h3>Autonomic Function Test in Patna</h3><p>These tests check how your body controls automatic actions like blood pressure, heart rate, sweating, and body temperature. Useful in patients who have fainting, dizziness, or nervous system problems like diabetes-related nerve damage.</p><h3>Fully Automated Biochemistry Lab in Patna</h3><p>Our lab offers blood tests including sugar, liver, kidney, cholesterol, urine tests, and hormone and thyroid tests. All tests are done on advanced machines for fast, accurate results. 100 percent automation for quality you can trust.</p><h2>Conditions We Treat</h2><p>Stroke treatment in Patna, Epilepsy treatment in Patna, Neuropathy treatment, Vertigo treatment, Migraine and headache treatment, Dementia care, Parkinson disease treatment, Brain tumor diagnosis, Spinal disorders, Nerve pain, Diabetic neuropathy, Sleep disorders, Knee replacement surgery in Patna, Hip replacement surgery in Patna, Trauma and emergency care.</p><h2>Why Choose Paramhans Institute of Neurology Patna</h2><p>Led by Dr. Sanjay Kumar (FRCP London), one of the most experienced neurologists in Bihar. 62 plus centrally air-conditioned beds including ICU, emergency, OPD, general ward, and deluxe rooms. Advanced diagnostic equipment. 24/7 emergency services. Affordable prices. Compassionate and personalised treatment focused on recovery and long-term wellness.</p><h2>Contact Paramhans Institute of Neurology Patna</h2><p>Address: B 18, Besides State Bank of India (Personalised Branch), Near Kendriya Vidyalaya, Kankarbagh, Patna, Bihar 800020</p><p>Phone: +91 9304508599, +91 9693212995, 0612-2666667</p><p>Email: info@pinpat.in</p><p>Website: https://pinpat.in</p><p>Open 24/7 for emergencies</p></noscript><div id="root"></div></body></html>
